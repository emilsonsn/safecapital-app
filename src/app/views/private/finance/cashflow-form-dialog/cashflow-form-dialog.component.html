<div class="dialog-head"><h2>{{data.item?'Editar':'Novo'}} {{data.type==='supplier'?'fornecedor':data.type==='expense'?'saída':'valor a resgatar'}}</h2></div><mat-dialog-content><form [formGroup]="form">
@if(data.type==='supplier'){<label>Nome*<input formControlName="name"></label><div class="grid"><label>CPF/CNPJ<input formControlName="tax_id"></label><label>Telefone<input formControlName="phone"></label></div><label>E-mail<input type="email" formControlName="email"></label><label class="check"><input type="checkbox" formControlName="is_active"> Fornecedor ativo</label>}
@if(data.type==='expense'){<div class="grid"><label>Fornecedor<select formControlName="supplier_id"><option [ngValue]="null">Sem fornecedor</option>@for(s of data.suppliers||[];track s.id){<option [ngValue]="s.id">{{s.name}}</option>}</select></label><label>Categoria*<input formControlName="category"></label></div><label>Descrição*<input formControlName="description"></label><div class="grid"><label>Valor*<input type="number" min="0.01" step="0.01" formControlName="amount"></label><label>Vencimento<input type="date" formControlName="due_date"></label></div><label>Status<select formControlName="status"><option value="PENDING">Pendente</option><option value="PAID">Paga</option><option value="CANCELLED">Cancelada</option></select></label><label>Referência<input formControlName="payment_reference"></label>}
@if(data.type==='recoverable'){<div class="grid"><label>Referência<input formControlName="reference"></label><label>Nº do processo<input formControlName="case_number"></label></div><label>Parte envolvida<input formControlName="counterparty"></label><label>Descrição*<input formControlName="description"></label><div class="grid"><label>Valor*<input type="number" min="0.01" step="0.01" formControlName="amount"></label><label>Previsão<input type="date" formControlName="expected_recovery_date"></label></div>}
<label>Observações<textarea rows="3" formControlName="notes"></textarea></label></form></mat-dialog-content><mat-dialog-actions><button class="button cancel" (click)="ref.close()">Cancelar</button><button class="button primary" [disabled]="loading" (click)="submit()">Salvar</button></mat-dialog-actions>
