<div class="dialog-title"><div><i class="fa-solid fa-circle-check"></i></div><span><h2>Marcar fatura como paga</h2><p>Fatura #{{data.invoice.id}} · {{data.invoice.amount|currency:'BRL'}}</p></span></div>
<mat-dialog-content><form [formGroup]="form"><label>Data e hora do pagamento <input type="datetime-local" formControlName="paid_at"><small>Se não informada, será utilizada a data e hora atual.</small></label><label>Referência do pagamento <input type="text" maxlength="100" formControlName="payment_reference" placeholder="Ex.: REC-2026-001"></label><label>Observações <textarea rows="4" maxlength="1000" formControlName="payment_notes" placeholder="Informações para auditoria financeira"></textarea><small>{{form.value.payment_notes?.length||0}}/1000</small></label></form><div class="notice"><i class="fa-solid fa-circle-info"></i>As parcelas vinculadas em aberto também serão marcadas como pagas.</div></mat-dialog-content>
<mat-dialog-actions><button class="button cancel" [disabled]="loading" (click)="ref.close(false)">Cancelar</button><button class="button primary" [disabled]="loading" (click)="submit()">{{loading?'Registrando...':'Confirmar pagamento'}}</button></mat-dialog-actions>
