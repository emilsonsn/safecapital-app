<div class="top-actions"><div class="filter"><i class="fa-solid fa-search"></i><input [(ngModel)]="search" (keyup.enter)="page=1;load()" placeholder="Nome, CPF/CNPJ ou e-mail"><select [(ngModel)]="active" (change)="page=1;load()"><option value="">Todos</option><option value="true">Ativos</option><option value="false">Inativos</option></select><button (click)="load()">Buscar</button></div><button class="button primary" (click)="open()"><i class="fa-solid fa-plus"></i> Novo fornecedor</button></div><div class="cash-panel"><div class="table-wrap"><table class="table"><thead><tr><th>Fornecedor</th><th>CPF/CNPJ</th><th>Contato</th><th>Despesas</th><th>Status</th><th>Ações</th></tr></thead><tbody>@if(loading){<tr><td colspan="6" class="empty">Carregando...</td></tr>}@if(!loading&&!items.length){<tr><td colspan="6" class="empty">Nenhum fornecedor encontrado.</td></tr>}@for(x of items;track x.id){<tr><td><strong>{{x.name}}</strong><small>{{x.notes||''}}</small></td><td>{{x.tax_id||'—'}}</td><td>{{x.email||'—'}}<small>{{x.phone||''}}</small></td><td>{{x.expenses_count||0}}</td><td><span class="badge" [class.green]="x.is_active">{{x.is_active?'Ativo':'Inativo'}}</span></td><td class="actions"><button (click)="open(x)" matTooltip="Editar"><i class="fa-solid fa-pen"></i></button><button (click)="toggle(x)" [matTooltip]="x.is_active?'Desativar':'Ativar'"><i class="fa-solid" [class.fa-ban]="x.is_active" [class.fa-check]="!x.is_active"></i></button></td></tr>}</tbody></table></div><mat-paginator [length]="total" [pageIndex]="page-1" [pageSize]="perPage" [pageSizeOptions]="[15,25,50,100]" (page)="pageEvent($event)"></mat-paginator></div>
