<div class="dialog-head"><h2>{{data.kind==='expense'?'Registrar pagamento':data.kind==='received'?'Marcar como recebido':'Marcar como não recuperável'}}</h2><p>{{data.item.description}} · {{data.item.amount|currency:'BRL'}}</p></div><mat-dialog-content><form [formGroup]="form"><label>Data e hora<input type="datetime-local" formControlName="date"><small>Em branco utiliza a data atual.</small></label>@if(data.kind==='expense'){<label>Referência<input formControlName="reference" placeholder="PIX, recibo ou identificação"></label>}<label>Observações<textarea rows="4" formControlName="notes"></textarea></label></form></mat-dialog-content><mat-dialog-actions><button class="button cancel" (click)="ref.close()">Cancelar</button><button class="button primary" [disabled]="loading" (click)="submit()">Confirmar</button></mat-dialog-actions>
